services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: places_db
    restart: unless-stopped

  recommender:
    build:
      context: ./recommender
      dockerfile: Dockerfile
    container_name: recommender
    ports:
      - "8001:8001"
    volumes:
      - ./recommender:/app
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=places_db
    depends_on:
      - mongodb
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    restart: unless-stopped

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai_service
    ports:
      - "8002:8002"
    volumes:
      - ./ai:/app
    environment:
      - OLLAMA_URL=http://ollama:11434
      - RECOMMENDER_URL=http://recommender:8001
    depends_on:
      - ollama
      - recommender
    restart: unless-stopped

  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./api:/api/api
    environment:
      - RECOMMENDER_URL=http://recommender:8001
      - AI_SERVICE_URL=http://ai:8002
    depends_on:
      - recommender
      - ai
    restart: unless-stopped

volumes:
  mongodb_data:
  ollama_data:
